set_schedule:
  target:
    device:
      integration: edilkamin
    entity:
      integration: edilkamin
      domain: climate
  fields:
    days:
      required: true
      example: [monday, tuesday]
      selector:
        select:
          multiple: true
          translation_key: weekdays
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    start:
      required: true
      example: "06:00:00"
      selector:
        time:
    end:
      required: true
      example: "08:30:00"
      selector:
        time:
    mode:
      required: true
      selector:
        select:
          translation_key: chrono_modes
          options: ["off", economy, comfort]
    preview_only:
      default: false
      selector:
        boolean:
    auto_restore:
      default: false
      selector:
        boolean:
    date:
      example: "2026-12-01"
      selector:
        date:
